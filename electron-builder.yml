# https://www.electron.build/configuration/configuration
appId: com.aidesktoppet.app
productName: Pet AI
directories:
  output: release
  buildResources: build  # 아이콘, 추가 리소스는 build/ 아래에 둠

files:
  - out/**/*
  - python/**/*
  - package.json
  - "!**/.env"
  - "!**/.env.*"
  - "!src/**"
  - "!**/.vscode/*"
  - "!**/__pycache__/**"
  - "!{.gitignore,README.md,CHANGELOG.md,electron.vite.config.ts,tsconfig*.json}"

extraResources:
  - from: python/
    to: python/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"
  # 트레이 아이콘은 asar 밖 Resources/ 에 둬야 메인 프로세스가 읽을 수 있다
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png

mac:
  category: public.app-category.utilities
  # arm64 = Apple 칩(M1~), x64 = Intel 맥. 받는 사람이 자기 맥에 맞는 파일을 고른다.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: 채팅 음성 입력에 사용해요 (선택)
  # 개발자 인증서가 없으므로 builder 서명은 끄고 afterPack에서 애드혹 서명만 한다.
  # 서명이 깨진 채로 두면 Apple 칩 맥이 "손상된 앱"으로 막아버리고, 애드혹이면 "그래도 열기"로 열 수 있다.
  # 공증(notarize)을 안 하므로 hardened runtime은 의미가 없고, 켜면 애드혹 서명과 충돌한다.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - nsis
    - portable
  # icon: build/icon.ico  # 256x256 PNG → ico 변환 후 사용

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
afterPack: scripts/adhoc-sign.cjs
